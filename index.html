<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Origin Labs...</title>
  <meta name="robots" content="noindex">

  <!-- Instant redirect (no JavaScript needed) -->
  <meta http-equiv="refresh" content="0; url=https://www.origin-labs.org/go/ignant">
  <link rel="canonical" href="https://www.origin-labs.org/go/ignant">

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #0b0b0f;
      color: #f2f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      margin: 0 0 8px;
      font-size: 1.05rem;
    }
    a {
      color: #8ab4ff;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="spinner" aria-hidden="true"></div>
  <p>Taking you to Origin Labs&hellip;</p>
  <a href="https://www.origin-labs.org/go/ignant">Click here if you aren't redirected</a>

  <!-- JavaScript fallback -->
  <script>
    window.location.replace("https://www.origin-labs.org/go/ignant");
  </script>
</body>
</html>
